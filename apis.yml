aid: flyr-labs
name: FLYR Labs
description: >-
  FLYR (formerly FLYR Labs) is a San Francisco-headquartered travel technology company, founded in 2013,
  that builds an AI-native commercial operating system for airlines, cargo carriers and hospitality
  operators. Its airline portfolio spans the Cirrus Revenue Operating System (deep-learning forecasting,
  dynamic pricing and revenue management) and an Offer & Order Management System built on IATA open
  standards — NDC and ONE Order — with a certified NDC+ API, an NDC Gateway for indirect and B2B channels
  (GDS, OTAs), and a Legacy Translator for backward compatibility with existing PSS estates. Its
  hospitality arm, FLYR Hospitality (built on the acquired Pace Revenue platform), ships Optimize, Insights,
  Planning and Groups to 2,300+ properties with native two-way integrations into property management
  systems including Mews, Oracle OPERA Cloud, Apaleo, Cloudbeds, RMS Cloud, Stayntouch and Planet/Protel.
  FLYR has raised over $500M and employs more than 700 people. Its APIs are commercial and partner-gated:
  the developer portal at developer.flyr.com requires an account, and no OpenAPI, AsyncAPI or GraphQL
  schema is published to anonymous callers.
