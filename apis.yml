apis:
- name: FLYR Offer & Order APIs
  description: >-
    FLYR's airline retailing API surface — the Offer & Order Management System (OOMS), a certified NDC+ API
    for rich-content offers and orders, an NDC Gateway that extends modern retailing to indirect and B2B
    channels (GDS and OTAs), and a Legacy Translator for airlines still on a traditional PSS. Documented
    behind the FLYR developer portal; no machine-readable contract is served to anonymous callers.
  humanURL: https://developer.flyr.com/
  tags:
  - airlines
  - airline-retailing
  - ndc
  - offer-and-order
  - revenue-management
  properties:
  - type: DeveloperPortal
    url: https://developer.flyr.com/
  - type: Documentation
    url: https://developer.flyr.com/
  x-access: partner-gated
  x-evidence:
    fetched: '2026-08-04'
    url: https://developer.flyr.com/
    http_status: 200
    note: >-
      Document360 knowledge base. Every path — including /docs/home, /api-docs, /sitemap.xml and every
      /.well-known/* — 302-redirects to /login?returnTo=..., which hands off to identity.document360.io.
      Self-registration is offered at /Account/SelfRegister. No article, OpenAPI or schema is reachable
      without an account.
- name: FLYR Hospitality Platform API
  description: >-
    The API tier behind the FLYR Hospitality (Pace Revenue) revenue management platform — Optimize, Insights,
    Planning and Groups — serving the app.pacerevenue.com console and the native two-way property-management-system
    integrations. Exposed as a GraphQL endpoint plus REST hosts. All hosts reject anonymous callers and
    GraphQL introspection is disabled, so no schema is publicly obtainable.
  humanURL: https://www.flyrhospitality.com/integrations
  baseURL: https://api.pacerevenue.com/
  tags:
  - hospitality
  - hotel-technology
  - revenue-management
  - dynamic-pricing
  - forecasting
  properties:
  - type: GraphQL
    url: https://graphql.pacerevenue.com/graphql
  - type: Support
    url: https://help.pacerevenue.com/en/
  - type: Login
    url: https://app.pacerevenue.com
  x-access: customer-gated
  x-evidence:
    fetched: '2026-08-04'
    hosts:
    - url: https://api.pacerevenue.com/
      http_status: 403
      note: nginx 403 to anonymous callers; HSTS max-age=31536000 includeSubDomains
    - url: https://graphql.pacerevenue.com/graphql
      http_status: 200
      note: >-
        Live Apollo GraphQL endpoint. POST {__schema{queryType{name}}} returns
        GRAPHQL_VALIDATION_FAILED — "GraphQL introspection has been disabled". Schema not published;
        SDL deliberately NOT reconstructed.
    - url: https://legacy-api.pacerevenue.com/
      http_status: 404
      note: JSON-serving legacy REST host referenced by the console bundle; no spec at any probed path
